<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compras">
<title>Compras Mercado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: app de uma coluna (max 480px), telas trocadas por JS, pílulas coloridas como elemento principal */
:root{
  --bg:#FFFBF7; --surface:#F3EEE8; --card:#FFFFFF; --fg:#1A1512; --muted:#6F655E; --line:#E6DED6;
  --ink:#1A1512; --on-ink:#FFFBF7;
  --tomato:#FF3D68; --mint:#9BF0C8; --sky:#A9C8FF; --peach:#FFC79A; --sun:#FFE45C; --lilac:#D8B8FF;
  --pill-fg:#1A1512; --good:#178A4E; --bad:#D6342B;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0C0B; --surface:#1C1917; --card:#211D1A; --fg:#F7F1EB; --muted:#A79C93; --line:#2F2925;
  --ink:#F7F1EB; --on-ink:#0E0C0B; --good:#4BD48A; --bad:#FF6B5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0C0B; --surface:#1C1917; --card:#211D1A; --fg:#F7F1EB; --muted:#A79C93; --line:#2F2925;
  --ink:#F7F1EB; --on-ink:#0E0C0B; --good:#4BD48A; --bad:#FF6B5E; color-scheme:dark}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.screen{flex:1;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.iconbtn:hover{background:var(--surface)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .25s}
.dots i.on{background:var(--fg)}
.dots i.cur{width:28px;background:var(--fg)}
.link{color:var(--muted);font-weight:600;padding:10px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8.5vw,42px);line-height:1.02;letter-spacing:-.02em;text-align:center;text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);text-align:center;margin:-8px 0 0;line-height:1.45}
.hero{flex:1;display:grid;place-items:center;min-height:180px;position:relative}
.cta{width:100%;height:60px;border-radius:99px;background:var(--ink);color:var(--tomato);font-weight:700;font-size:19px}
.cta.alt{background:var(--tomato);color:#1A1512}
.cta:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:12px;align-items:center}
.ghost{font-weight:700;padding:0 18px;height:60px}

/* Mascote: morango original */
.mascot{--s:150px;width:var(--s);height:var(--s);position:relative;animation:bob 3s ease-in-out infinite}
.mascot .body{position:absolute;inset:16% 8% 0;border-radius:46% 46% 50% 50% / 36% 36% 64% 64%;
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.5) 0 6%,transparent 16%),
    radial-gradient(circle,#FFE59A 0 calc(var(--s)*.012),transparent calc(var(--s)*.017)) 0 0/calc(var(--s)*.15) calc(var(--s)*.14),
    radial-gradient(circle,#FFE59A 0 calc(var(--s)*.012),transparent calc(var(--s)*.017)) calc(var(--s)*.075) calc(var(--s)*.07)/calc(var(--s)*.15) calc(var(--s)*.14),
    linear-gradient(170deg,#FF5A78,#E8193C 60%,#C0102E);
  box-shadow:0 0 calc(var(--s)*.35) rgba(255,61,104,.45)}
.mascot .leaf{position:absolute;left:50%;top:5%;width:54%;height:24%;transform:translateX(-50%);z-index:1;background:#2FA35A;
  clip-path:polygon(50% 0,58% 38%,98% 28%,68% 58%,88% 100%,50% 74%,12% 100%,32% 58%,2% 28%,42% 38%)}
.mascot .leaf::before{left:0;transform:rotate(-15deg)}
.mascot .leaf::after{right:0;transform:scaleX(-1) rotate(-15deg)}
.mascot .eye{position:absolute;top:44%;z-index:1;width:7%;height:17%;background:#1A1512;border-radius:99px;animation:blink 4.5s infinite}
.mascot .eye.l{left:36%}.mascot .eye.r{right:36%}
.mascot .cheek{position:absolute;top:62%;width:12%;height:7%;border-radius:50%;background:#FFB3C2;opacity:.85;z-index:1}
.mascot .cheek.l{left:22%}.mascot .cheek.r{right:22%}
.mascot.think .eye{height:12%;top:46%}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.mascot,.mascot .eye{animation:none}}
.float{position:absolute;font-size:34px;filter:saturate(1.1)}

/* Tema */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{border-radius:28px;padding:12px 12px 16px;text-align:left;border:3px solid transparent;display:flex;flex-direction:column;gap:12px;font-weight:700}
.tcard.light{background:#fff;color:#1A1512;border-color:#E6DED6}
.tcard.dark{background:#1C1917;color:#F7F1EB;border-color:#2F2925}
.tcard.sel{border-color:var(--tomato)}
.tprev{border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:5px}
.light .tprev{background:#F3EEE8}.dark .tprev{background:#0E0C0B}
.tprev b{display:block;height:16px;border-radius:99px}
.tprev b:first-child{height:30px}

/* Chips */
.group{display:flex;flex-direction:column;gap:10px}
.glabel{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--muted);text-transform:uppercase;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 16px;border-radius:99px;background:var(--surface);font-weight:600;border:2px solid transparent}
.chip.on{background:var(--ink);color:var(--on-ink)}

/* Pílulas de lista */
.pills{display:flex;flex-direction:column;gap:8px}
.pill{min-height:72px;border-radius:99px;padding:0 22px 0 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:20px;font-weight:600;color:var(--pill-fg);border:3px solid transparent;text-align:left;width:100%}
.pill.sel{border-color:var(--fg)}
.pill .em{font-size:28px}
.pill small{display:block;font-size:13px;font-weight:500;opacity:.7}
.pillin{min-height:72px;border-radius:99px;background:var(--surface);border:3px solid transparent;padding:0 26px;font-size:19px;width:100%}
.pillin.sel{border-color:var(--fg)}
.c-tomato{background:var(--tomato)}.c-mint{background:var(--mint)}.c-sky{background:var(--sky)}
.c-peach{background:var(--peach)}.c-sun{background:var(--sun)}.c-lilac{background:var(--lilac)}

/* Home */
.greet{display:flex;gap:14px;align-items:center}
.bubble{background:var(--surface);border-radius:20px 20px 20px 6px;padding:12px 14px;line-height:1.4;flex:1;min-width:0}
.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);
  padding:10px 0 calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px;border-radius:14px}
.tab span{font-size:20px}
.tab.on{color:var(--fg);background:var(--surface)}
.add-list{border:2px dashed var(--line);border-radius:99px;min-height:64px;font-weight:700;color:var(--muted)}

/* Lista */
.lhead{border-radius:32px;padding:18px 20px;color:#1A1512;display:flex;flex-direction:column;gap:10px}
.lhead h2{font-size:28px}
.bar{height:8px;background:rgba(26,21,18,.15);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:#1A1512;border-radius:99px;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.adder{display:flex;gap:8px}
.adder textarea{flex:1;min-width:0;border-radius:24px;background:var(--surface);border:2px solid transparent;padding:14px 18px;resize:none;height:54px;font:inherit;color:inherit}
.adder textarea:focus{border-color:var(--fg);outline:none;height:110px}
.round{width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:22px;flex:none;display:grid;place-items:center}
.round.mic{background:var(--surface);color:var(--fg)}
.round.mic.rec{background:var(--tomato);color:#1A1512}
.hint{font-size:13px;color:var(--muted);margin:-12px 4px 0}
.items{display:flex;flex-direction:column;gap:6px;list-style:none;padding:0;margin:0}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px 12px 10px 10px}
.check{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--fg);flex:none;display:grid;place-items:center;font-size:16px;font-weight:800}
.item.done .check{background:var(--tomato);border-color:var(--tomato);color:#1A1512}
.item.done .iname{text-decoration:line-through;color:var(--muted)}
.ibody{flex:1;min-width:0;text-align:left}
.iname{font-weight:600;overflow-wrap:anywhere}
.isub{font-size:13px;color:var(--muted)}
.iprice{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.iprice.empty{color:var(--muted);font-weight:500;font-size:14px}
.sec{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--muted);text-transform:uppercase;margin:6px 4px 0}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sugg .chip{white-space:nowrap;flex:none}
.empty{text-align:center;color:var(--muted);padding:24px 8px;display:flex;flex-direction:column;align-items:center;gap:12px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select{height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:0 14px;font-size:17px;color:var(--fg);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}.grid2 input,.grid2 select{width:100%;min-width:0}
.danger{color:var(--bad);font-weight:700;padding:12px}

/* Insights */
.kpi{border-radius:28px;padding:20px;background:var(--sun);color:#1A1512;display:flex;flex-direction:column;gap:4px}
.kpi .big{font-family:var(--f-display);font-weight:800;font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.prow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.prow>div:first-child{min-width:0}
.delta{font-weight:700;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:99px;font-size:14px;white-space:nowrap}
.delta.up{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.delta.down{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.delta.eq{background:var(--surface);color:var(--muted)}
.alert{border-radius:22px;padding:14px 16px;background:var(--lilac);color:#1A1512;line-height:1.4}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:18px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars b{width:100%;border-radius:10px 10px 4px 4px;background:var(--sky);min-height:4px}
.bars div.cur b{background:var(--tomato)}
.spark{width:100%;height:40px}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--surface);color:var(--muted);padding:3px 8px;border-radius:99px}

/* Novos blocos */
.promo{border-radius:28px;padding:16px 18px;display:flex;align-items:center;gap:14px;color:#1A1512;text-align:left;width:100%}
.promo .t{flex:1;min-width:0;line-height:1.35;font-size:14px}
.promo .t b{display:block;font-size:17px;margin-bottom:2px}
.promo .em{font-size:30px;flex:none}
.promo .side{display:flex;flex-direction:column;gap:2px;align-items:center;flex:none}
.promo .link{color:#1A1512;opacity:.7;font-size:13px;padding:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 18px;border-radius:99px;background:var(--surface);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn.dark{background:var(--ink);color:var(--on-ink)}
.promo .btn.dark{background:#1A1512;color:#FFFBF7}
.stepper{display:flex;align-items:center;gap:16px;justify-content:center}
.stepper button{width:52px;height:52px;border-radius:50%;background:var(--surface);font-size:24px;font-weight:700}
.stepper output{font-family:var(--f-display);font-weight:800;font-size:44px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;line-height:1.45}
.prog{height:10px;background:var(--surface);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:4%;background:var(--tomato);transition:width .2s}
.rv{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px 10px;align-items:center}
.rv-q{grid-column:2;display:grid;grid-template-columns:78px 68px minmax(0,1fr) auto;gap:8px;align-items:end}
.rv-q label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.rv select{height:42px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 6px;font-size:15px;color:var(--fg);width:100%}
.rv-tot{font-weight:800;white-space:nowrap;padding-bottom:10px;font-variant-numeric:tabular-nums}
.rvh{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rv{padding:10px 0;border-bottom:1px solid var(--line)}
.rv input[type=text],.rv input[type=number]{height:42px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 8px;font-size:15px;color:var(--fg);min-width:0;width:100%}
.rv input[type=checkbox]{width:22px;height:22px;accent-color:var(--tomato)}
.sheet textarea{border-radius:16px;border:2px solid var(--line);background:var(--card);padding:12px;min-height:130px;width:100%;font:inherit;color:var(--fg);resize:vertical}
.sheet p{margin:0;line-height:1.45}
.est{font-size:13px;opacity:.75}
.pctbar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface)}
.pctbar i{display:block;min-width:0}
.pname{flex:1;min-width:0;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 12px;font-weight:700;font-size:17px;color:var(--fg)}
.ppct{display:flex;align-items:center;gap:4px;font-weight:700;flex:none}
.ppct input{width:64px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 8px;font-size:16px;color:var(--fg);text-align:right}
.cem{font-size:24px;flex:none}
.chip.ed{display:inline-flex;align-items:center;gap:6px;padding:7px 7px 7px 14px}
.chip.ed button{width:24px;height:24px;border-radius:50%;background:var(--line);font-size:12px;display:grid;place-items:center}
.chip.ed small{color:var(--muted);font-weight:500}
.padd{flex:1;min-width:0;height:46px;border-radius:99px;border:2px solid var(--line);background:var(--card);padding:0 16px;color:var(--fg)}
.over{color:var(--bad)}
.dev{display:flex;align-items:center;gap:14px}
.dev img{width:96px;height:96px;object-fit:contain;flex:none;border-radius:16px;background:#fff}
.mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mail code{font-family:inherit;font-weight:700;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.pickbar{position:sticky;bottom:0;margin-top:auto;padding:14px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.chip.pk.on::before{content:"✓ "}
.adder .pillin{flex:1;min-width:0;min-height:60px}
.adder .pillin + .round{width:60px;height:60px;font-size:28px}
.pkh{display:flex;gap:2px;flex:none}
.pkh .link{padding:4px 6px;font-size:13px}
.pkh .link.on{color:var(--fg);text-decoration:underline}
.chip.pkplus{border:2px dashed var(--line);background:none;color:var(--muted)}
.pkg.editing{background:var(--surface);border-radius:20px;padding:12px;margin-inline:-12px}
.pkg.editing .chip.ed{background:var(--card)}
.pkg .prow{align-items:center}
.ldate{font-weight:600;font-size:15px}
.share-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:22px;padding:14px 16px;background:var(--surface);color:var(--fg);text-decoration:none}
.share-opt .em{font-size:28px;flex:none}
.share-opt .t{flex:1;min-width:0;line-height:1.35;font-size:14px;color:var(--muted)}
.share-opt .t b{display:block;font-size:17px;color:var(--fg);margin-bottom:2px}
.share-opt.main{background:#25D366;color:#0B2E17}
.share-opt.main .t,.share-opt.main .t b{color:#0B2E17}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:99px;background:var(--surface);color:var(--muted);font-weight:700;font-size:14px;padding:0 6px}
.st b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--fg);font-size:12px;flex:none}
.st.on{background:var(--ink);color:var(--on-ink)}
.st.on b{background:var(--tomato);color:#1A1512}
.st.past b{background:var(--good);color:#fff}
.mrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:4px 2px;min-height:48px}
.mrow .ibody{display:flex;flex-direction:column}
.item.big{padding:10px 14px}
.item.big .iname{font-size:19px}
.item.big .check{width:36px;height:36px;font-size:18px}
.tabbar .fab{grid-column:1/-1;padding:0 0 8px}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;text-align:left;width:100%}
.hrow>span:first-child{min-width:0}
.hrow b{display:block;overflow-wrap:anywhere}
.hrow small{display:block;color:var(--muted);font-size:13px}
.hrow .htot{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.donebox{border-radius:24px;padding:16px 18px;background:color-mix(in srgb,var(--good) 16%,transparent);display:flex;flex-direction:column;gap:4px;line-height:1.4}
.donebox b{font-size:17px}
.onb1 .stepper{justify-content:flex-start}
.onb1 .field{color:var(--fg);font-size:15px}
body{font-size:17px}
.iname{font-size:17px}
.pill.c-list{background:var(--surface);color:var(--fg)}
.lhead.c-list{background:var(--surface);color:var(--fg)}
.lhead.c-list .bar{background:var(--line)}
.lhead.c-list .bar i{background:var(--tomato)}
.pkg .pkbody{display:none;flex-direction:column;gap:10px;padding:8px 0 4px}
.pkg.open .pkbody,.searching .pkg .pkbody{display:flex}
.pkhead{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:54px;padding:0 4px;font-weight:700;font-size:17px;border-bottom:1px solid var(--line);text-align:left}
.pkcount{display:flex;gap:10px;align-items:center;flex:none}
.pkn{color:var(--good);font-weight:700;font-size:14px}
.chev{color:var(--muted);font-size:24px;line-height:1;transition:transform .2s;display:inline-block}
.pkg.open .chev,.searching .chev{transform:rotate(90deg)}
.pkg.top .glabel{margin-bottom:8px}
.pkmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-weight:600;min-height:32px}
.pksearch{display:flex;gap:8px}
.pksearch .btn{flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip{border-radius:18px;padding:12px 14px;background:color-mix(in srgb,var(--tomato) 14%,transparent);display:flex;gap:10px;align-items:center;line-height:1.4}
.tip p{margin:0;flex:1;min-width:0}
.tip .link{flex:none;color:var(--fg);padding:6px 4px}
.lcount{font-weight:600}
.iest{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;padding:0 4px}
.pkhrow{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.pkhrow .pkhead{border-bottom:0;flex:1;min-width:0}
.iconbtn.sm{width:40px;height:40px;font-size:17px;flex:none}
.ufrow{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-weight:600}
.ufrow select,.field select.uf{height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);padding:0 10px;font-size:15px}
.credit{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--muted);font-size:13px;padding:8px}
.credit svg{width:28px;height:28px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:99px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* ---------- Insights ---------- */
function monthKey(d){return d.slice(0,7)}
function renderInsights(){
  const H=S.history,P=S.purchases;
  if(!H.length) return `<div class="screen"><div class="topbar"><h2>Gastos</h2></div>
    <div class="empty">${mascot(110,"think")}<p>Quando você concluir uma compra com o cupom fiscal, aparece aqui quanto gastou no mês, quanto cada produto subiu e quando a embalagem encolheu.</p>
    <button class="cta" data-act="sample">Ver com dados de exemplo</button></div>${tabs("insights")}</div>`;
  const now=new Date(),months=[];for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);months.push(d.toISOString().slice(0,7))}
  const byM=Object.fromEntries(months.map(m=>[m,0]));P.forEach(p=>{const m=monthKey(p.date);if(m in byM)byM[m]+=p.total});
  const max=Math.max(1,...Object.values(byM)),cur=byM[months[5]],prev=byM[months[4]];
  const groups={};H.forEach(h=>{(groups[h.name.toLowerCase()]??=[]).push(h)});
  const prods=Object.values(groups).map(g=>{g.sort((a,b)=>a.date.localeCompare(b.date));const f=g[0],l=g[g.length-1];
    const unitF=f.size?f.price/f.size:f.price,unitL=l.size?l.price/l.size:l.price;
    return{name:l.name,g,last:l.price,pct:(unitL/unitF-1)*100,shrink:f.size&&l.size&&l.size<f.size&&l.price>=f.price*0.98?{f,l}:null}}).sort((a,b)=>b.pct-a.pct);
  const shr=prods.filter(p=>p.shrink);
  const mn=m=>new Date(m+"-02").toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
  const spark=g=>{if(g.length<2)return"";const v=g.map(h=>h.size?h.price/h.size:h.price),lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1;
    const pts=v.map((x,i)=>`${(i/(v.length-1)*100).toFixed(1)},${(36-(x-lo)/r*32).toFixed(1)}`).join(" ");
    return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--tomato)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`};
  const d=p=>{const c=Math.abs(p)<0.5?"eq":p>0?"up":"down";return `<span class="delta ${c}">${c==="eq"?"=":(p>0?"▲ ":"▼ ")+Math.abs(p).toFixed(1).replace(".",",")+"%"}</span>`};
  return `<div class="screen"><div class="topbar"><h2>Gastos</h2>${S.sample?`<span class="tag">exemplo</span>`:""}</div>
    <div class="kpi"><span style="font-weight:600">Gasto em ${mn(months[5])}</span><span class="big">${brl(cur)}</span>
      <span>${prev?`${cur>=prev?"▲":"▼"} ${brl(Math.abs(cur-prev))} vs ${mn(months[4])}`:"Primeiro mês registrado"}</span></div>
    <div class="card"><p class="glabel">Para onde foi o dinheiro · 6 meses</p>
      <div class="bars">${months.map((m,i)=>`<div class="${i===5?"cur":""}"><span>${byM[m]?Math.round(byM[m]):""}</span><b style="height:${byM[m]/max*100}%"></b>${mn(m)}</div>`).join("")}</div></div>
    ${shr.map(p=>`<div class="alert"><b>📦 ${esc(p.name)} encolheu.</b> Passou de ${p.shrink.f.size}${p.shrink.f.sizeUnit} para ${p.shrink.l.size}${p.shrink.l.sizeUnit} e o preço não baixou (${brl(p.shrink.f.price)} → ${brl(p.shrink.l.price)}).</div>`).join("")}
    <div class="card"><p class="glabel">Quanto cada produto subiu · preço por medida</p>
      ${prods.map(p=>`<div><div class="prow"><div><div class="iname">${esc(p.name)}</div><div class="isub">${p.g.length} compras · último ${brl(p.last)}</div></div>${d(p.pct)}</div>${spark(p.g)}</div>`).join("")}</div>
    ${S.sample?`<button class="link" data-act="clear-sample">Remover dados de exemplo</button>`:""}
    ${tabs("insights")}</div>`;
}

/* ---------- Sheets ---------- */
function sheet(html,onMount){const s=document.createElement("div");s.className="scrim";s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener("click",e=>{if(e.target===s)s.remove()});document.body.appendChild(s);onMount&&onMount(s.firstElementChild,()=>s.remove())}

    <label class="field">Nome<input id="e-name" value="${esc(it.name)}"></label>
    <label class="field">Categoria<select id="e-cat">${[...new Set([...getPlan().map(c=>c.name),it.cat||"Outros","Outros"])].map(c=>`<option ${c===(it.cat||"Outros")?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
    <div class="grid2"><label class="field">Quantidade<input id="e-qty" type="number" inputmode="decimal" min="0" step="any" value="${it.qty}"></label>

    <label class="field"><span id="e-plab">${it.unit==="g"?"Preço do kg (R$)":"Preço unitário (R$)"}</span><input id="e-price" type="number" inputmode="decimal" min="0" step="0.01" value="${it.price??""}" placeholder="0,00"></label>
    <details><summary class="link" style="padding:6px 0;cursor:pointer">Mais detalhes (embalagem)</summary><div class="grid2"><label class="field">Tamanho da embalagem<input id="e-size" type="number" inputmode="decimal" min="0" value="${it.size??""}" placeholder="ex.: 500"></label>
    <label class="field">Medida<select id="e-su">${["g","kg","ml","L","un"].map(u=>`<option ${u===(it.sizeUnit||"g")?"selected":""}>${u}</option>`).join("")}</select></label></div>
    <p class="hint" style="margin:6px 0 0">Com o tamanho dá para saber quando a embalagem diminui sem o preço baixar.</p></details>
    <button class="cta alt" id="e-save">Salvar</button><button class="danger" id="e-del">Remover item</button>`,(el,close)=>{
    el.querySelector("#e-unit").onchange=ev=>{el.querySelector("#e-plab").textContent=ev.target.value==="g"?"Preço do kg (R$)":"Preço unitário (R$)";const q=el.querySelector("#e-qty");if(ev.target.value==="g"&&+q.value<20)q.value=Math.round((+q.value||1)*(it.unit==="kg"?1000:100))};
    el.querySelector("#e-save").onclick=()=>{const n=el.querySelector("#e-name").value.trim();if(!n){toast("Dá um nome pro item.");return}

      save();close();render()};
    el.querySelector("#e-del").onclick=()=>{l.items=l.items.filter(x=>x!==it);save();close();render()};

function closeList(l){
  const done=l.items.filter(i=>i.done),date=l.date||todayISO(),total=done.reduce((a,i)=>a+(i.price||0)*qf(i),0);

    S.purchases.push({date,total,list:l.name,listId:l.id,store:l.store||""})}
  l.closed=true;l.date=date;l.total=l.cupomTotal||total;l.stage="done";
  if(S.sample){S.history=S.history.filter(h=>!h.sample);S.purchases=S.purchases.filter(p=>!p.sample);S.sample=false}

let rec=null;
function mic(btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Voz não disponível neste navegador. Digite ou cole a lista.");return}
  if(rec){rec.stop();return}
  try{rec=new SR();rec.lang="pt-BR";rec.interimResults=false;
    rec.onresult=e=>{const t=[...e.results].map(r=>r[0].transcript).join(", ");$("#add-txt").value=t;addText()};
    rec.onerror=()=>toast("Não consegui ouvir. Confere a permissão do microfone.");
    rec.onend=()=>{rec=null;btn.classList.remove("rec")};rec.start();btn.classList.add("rec");toast("Pode falar…")}catch(e){rec=null;toast("Voz não disponível aqui. Digite ou cole a lista.")}
}

  setTimeout(()=>$("#add-txt")?.focus(),0);

/* ---------- Lista padrão do mês ---------- */
function defaultPeople(){return S.people||(S.prefs.includes("Moro sozinho")?1:2+(S.prefs.includes("Tem criança")?1:0))}
function getPlan(){return S.plan||JSON.parse(JSON.stringify(DEFAULT_PLAN)).filter(c=>!c.opt||S[OPT[c.opt].flag])}
function setOptCat(key,on){ // liga/desliga a categoria Bebê ou Pet, guardando os itens se desligar
  const P=mergeOptCats(getPlan()),i=P.findIndex(c=>c.opt===key);S[OPT[key].flag]=!!on;S.optStash=S.optStash||{};
  if(on&&i<0)P.push(S.optStash[key]||JSON.parse(JSON.stringify(DEFAULT_PLAN.find(c=>c.opt===key))));
  if(!on&&i>=0){S.optStash[key]=P[i];P.splice(i,1)}
  S.plan=P;save()}
const optChips=()=>`<div class="chips">${Object.entries(OPT).map(([k,o])=>`<button class="chip ${S[o.flag]?"on":""}" data-optcat="${k}" aria-pressed="${!!S[o.flag]}">${o.label}</button>`).join("")}</div>`;
function monthItems(people,all){
  const P=S.prefs,vegan=P.includes("Sou vegano"),pet=P.includes("Tenho pet"),bebe=P.includes("Tem bebê");
  const plan=getPlan();if(!plan.length)return [];
  const catBy=(re,fb)=>(plan.find(c=>re.test(c.name))||plan[fb]||plan[0]).name;
  const PROT=catBy(/prote/i,0),HORT=catBy(/horti/i,1),MERC=catBy(/merce/i,2),PAD=catBy(/padar|matin/i,4);
  let rows=[];
  plan.forEach(c=>c.items.forEach(it=>{if(!all&&it.need==="pet"&&!pet)return;if(!all&&it.need==="bebe"&&!bebe)return;rows.push([c.name,it.name,it.unit||"un",it.pp??.5,it.min??1])}));
  const swap=(a,b)=>rows.forEach(r=>{if(r[1]===a)r[1]=b});
  const drop=re=>{rows=rows.filter(r=>!re.test(r[1]))};
  if(P.includes("Sem lactose")){swap("Leite 1L","Leite sem lactose 1L");swap("Iogurte","Iogurte sem lactose");swap("Queijo muçarela 200g","Queijo sem lactose");swap("Requeijão","Requeijão sem lactose")}
  if(P.includes("Sem glúten")){swap("Macarrão 500g","Macarrão sem glúten");swap("Pão de forma","Pão sem glúten");swap("Biscoito","Biscoito sem glúten");swap("Torrada","Torrada sem glúten");swap("Aveia","Tapioca")}
  if(vegan){swap("Leite 1L","Leite vegetal 1L");swap("Leite sem lactose 1L","Leite vegetal 1L");
    drop(/^(Carne|Frango|Peixe|Ovos|Linguiça|Embutidos|Manteiga|Queijo|Iogurte|Requeijão|Presunto|Peito de peru|Pão de queijo)/);
    rows.push([PROT,"Tofu","un",1,1],[PROT,"Grão-de-bico","pct",.5,1],[PROT,"Proteína de soja","pct",.5,1])}
  else if(P.includes("Vegetariano")){drop(/^(Carne|Frango|Peixe|Linguiça|Embutidos|Presunto|Peito de peru)/);rows.push([PROT,"Grão-de-bico","pct",.5,1],[PROT,"Lentilha","pct",.5,1])}
  if(P.includes("Mais proteína")&&!vegan)rows.push([PROT,"Peito de frango","kg",1,1]);
  if(P.includes("Low carb"))drop(/^(Biscoito|Açúcar|Macarrão|Refrigerante|Cereal)/);
  if(P.includes("Tenho diabetes")){drop(/^(Açúcar|Refrigerante)/);rows.push([MERC,"Adoçante","un",0,1])}
  if(P.includes("Menos sal"))rows.push([HORT,"Temperos naturais","un",0,2]);
  if(P.includes("Tem criança"))rows.push([PAD,"Lanche escolar","pct",0,4],[PAD,"Suco de caixinha","un",0,8]);
  if(P.includes("Alergia a frutos do mar"))drop(/atum|camar/i);
  const hide=new Set(plan.flatMap(c=>c.hide||[]).map(norm));rows=rows.filter(r=>!hide.has(norm(r[1])));
  return rows.filter(r=>!blocked(r[1])).map(([cat,name,unit,pp,min])=>({id:uid(),name,cat,unit,
    qty:unit==="kg"?Math.max(min,Math.round(pp*people*2)/2):Math.max(min,Math.ceil(pp*people-1e-9)),
    price:lastPrice(name),size:null,done:false})).filter(i=>all||i.qty>0); // na Nova lista aparecem todos; na compra do mês só os com quantidade
}

/* ---------- Nova lista com data: escolher itens da relação ---------- */
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
const fmtD=iso=>iso.slice(8,10)+"/"+iso.slice(5,7);
const fmtLong=iso=>new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
const defName=iso=>`Mercado · ${fmtD(iso)}`;
function relation(){
  const base=monthItems(1,true).map(i=>({cat:i.cat,name:i.name,unit:i.unit}));
  const seen=new Set(base.map(i=>norm(i.name)));
  S.lists.forEach(l=>l.items.forEach(i=>{const k=norm(i.name);if(!seen.has(k)){seen.add(k);base.push({cat:"Já usados nas suas listas",name:i.name,unit:i.unit||"un"})}}));
  (ui.pick?.extra||[]).forEach(n=>{if(!seen.has(norm(n))){seen.add(norm(n));base.push({cat:"Outros",name:n,unit:"un"})}});
  return base;
}
function pickEst(pk){return Object.keys(pk.sel).reduce((a,k)=>{const nm=k.slice(k.indexOf("|")+1),u=estUnit(nm);return a+(u!=null?u*(pk.qty?.[k]||1):0)},0)}
function pickLabel(pk){const n=Object.keys(pk.sel).length;if(!n)return "Escolha os itens";const e=pickEst(pk);return `${pk.addTo?"Incluir":"Criar lista com"} ${n} ${n>1?"itens":"item"}${e?` · ~${brl(e)}`:""}`}
function renderPick(){

  const freq={};S.lists.forEach(l=>l.items.forEach(i=>{const k=norm(i.name);freq[k]=(freq[k]||0)+1}));
  const seen=new Set(),top=R.filter(i=>freq[norm(i.name)]&&!seen.has(norm(i.name))&&seen.add(norm(i.name))).sort((a,b)=>freq[norm(b.name)]-freq[norm(a.name)]).slice(0,12);
  const cnt=c=>Object.keys(pk.sel).filter(k=>k.startsWith(c+"|")).length;
  return `<div class="screen"><div class="topbar"><button class="iconbtn" data-go="home" aria-label="Voltar">‹</button><h2 style="font-size:22px">${pk.addTo?"Incluir itens":"Nova lista"}</h2><span style="width:44px"></span></div>
    ${tipBox("pick","Toque nos itens que vai comprar. Use a busca para achar rápido ou incluir um item novo.")}
    <div class="pkmeta">${pk.showMeta?`<div class="grid2" style="flex:1"><label class="field">Data<input id="pk-date" type="date" value="${pk.date}"></label><label class="field">Nome<input id="pk-name" value="${esc(pk.name)}" placeholder="${esc(defName(pk.date))}" maxlength="40"></label></div>`
      :`<span>📅 ${pk.date===todayISO()?"Hoje":fmtD(pk.date)} · ${esc(pk.name||defName(pk.date))} · 📍 ${S.uf||DEFAULT_UF}</span><button class="link" data-act="pk-meta">mudar</button>`}</div>
    ${pk.showMeta?`<div class="ufrow"><span>📍 Seu estado, para os preços médios</span>${ufSelect("uf-pick")}</div>`:""}
    <div class="pksearch"><input id="pk-q" class="padd" type="search" placeholder="🔎 Buscar ou incluir item" aria-label="Buscar ou incluir item" autocomplete="off"><button class="btn dark" id="pk-addq" hidden>+ Incluir</button></div>
    <div id="pk-list" class="group">
    ${top.length?`<div class="group pkg top"><p class="glabel">⭐ Mais comprados</p><div class="chips">${top.map(i=>chip(i.cat,i)).join("")}</div></div>`:""}
    ${cats.map(c=>{const em=(plan.find(x=>x.name===c)||{}).em||(c.startsWith("Já")?"🕘":"🛍️"),its=R.filter(i=>i.cat===c);
      const inPlan=plan.some(x=>x.name===c),ed=inPlan&&pk.edit===c,open=ed||pk.open[c],m=cnt(c);
      return `<div class="group pkg${open?" open":""}${ed?" editing":""}" data-cat="${esc(c)}">
      <div class="pkhrow"><button class="pkhead" data-pktoggle="${esc(c)}" aria-expanded="${!!open}"><span>${em} ${esc(c)}</span><span class="pkcount"><span class="pkn">${m?m+" ✓":""}</span><span class="chev">›</span></span></button>${inPlan?`<button class="iconbtn sm" data-pkedit="${esc(c)}" data-pkopen="${ed?"":"1"}" aria-label="Editar a categoria ${esc(c)}">${ed?"✓":"✏️"}</button>`:""}</div>
      <div class="pkbody">${ed?`<label class="field">Nome da categoria<input class="pname" id="pk-cname" value="${esc(c)}" maxlength="40"></label><div class="chips">${its.map(i=>`<span class="chip ed">${esc(i.name)}<button data-pkrm="${esc(i.name)}" aria-label="Excluir ${esc(i.name)} de ${esc(c)}">✕</button></span>`).join("")||`<span class="isub">Nenhum item.</span>`}</div>
        <div class="adder"><input class="padd" id="pk-in" placeholder="Novo item (ex.: Morango)" aria-label="Novo item em ${esc(c)}"><button class="btn dark" data-pkin>Incluir</button></div>
        <div class="pkh"><button class="link on" data-pkedit="${esc(c)}">Pronto</button></div>`
      :`<div class="chips">${its.map(i=>chip(c,i)).join("")}${inPlan?`<button class="chip pkplus" data-pkedit="${esc(c)}" data-pkopen="1">+ Novo item</button>`:""}</div>
        ${inPlan?`<div class="pkh"><button class="link" data-pkall>Marcar todos</button><button class="link" data-pkedit="${esc(c)}">Editar</button></div>`:""}`}</div></div>`}).join("")}
    </div>
    <button class="btn ${pk.month?"":"dark"}" data-act="pick-month">${pk.month?"✕ Desmarcar a compra do mês":"📅 Marcar a compra do mês"}</button>

    <div class="pickbar"><button class="cta alt" data-act="pick-go" ${n?"":"disabled"}>${pickLabel(pk)}</button></div></div>`;

function bindPick(A){
  const pk=ui.pick;pk.open=pk.open||{};pk.qty=pk.qty||{};
  const upd=()=>{const n=Object.keys(pk.sel).length,b=A.querySelector("[data-act=pick-go]");b.disabled=!n;b.textContent=pickLabel(pk)};

  const d=$("#pk-date");if(d)d.onchange=e=>{pk.date=e.target.value||todayISO();const nm=$("#pk-name");if(nm)nm.placeholder=defName(pk.date)};

    A.querySelectorAll("#pk-list .pkg").forEach(g=>{let any=false;g.querySelectorAll(".chip.pk").forEach(c=>{const ct=norm(c.textContent),ok=!t||ct.includes(t);c.hidden=!ok;any=any||ok;if(t&&ct===t)exact=true});
      g.hidden=!!t&&(!any||g.classList.contains("top"))});

      if(!hit&&!pk.extra.includes(nm))pk.extra.push(nm);pk.sel[(hit?hit.cat:"Outros")+"|"+(hit?hit.name:nm)]=hit?.unit||"un";if(!hit)pk.open["Outros"]=true});
    const y=scrollY;render();scrollTo(0,y);toast("Incluído e marcado.")};

function createPicked(){

/* ---------- Tela: divisão do mês (editável) ---------- */

const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
// casa item da lista com produto do cupom: as 2 primeiras palavras do item precisam aparecer (aceita abreviação do cupom, ex.: "HIG" = higiênico)
function matches(item,product){const w=norm(item).split(" ").filter(x=>x.length>=3&&!/^\d/.test(x)).slice(0,2);if(!w.length)return false;
  const t=norm(product).split(" ").filter(Boolean);return w.every(x=>t.some(y=>y.startsWith(x)||(y.length>=3&&x.startsWith(y))))}
function lastPrice(name){for(let i=S.history.length-1;i>=0;i--){const h=S.history[i];if(!h.sample&&(norm(h.name)===norm(name)||matches(name,h.name)))return h.price}return null}
function sizeOf(name){const m=String(name).match(/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|lt|l)\b/i);if(!m)return null;let u=m[2].toLowerCase();if(u==="lt")u="L";if(u==="l")u="L";return{size:parseFloat(m[1].replace(",",".")),unit:u}}

/* ---------- Cupom fiscal ---------- */
function num(s){return parseFloat(String(s).replace(/\s/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."))}
const SKIP=/TOTAL|PAGAR|SUBTOTAL|DESCONTO|ACRESC|TROCO|DINHEIRO|CART[AÃ]O|CR[EÉ]DITO|D[EÉ]BITO|\bPIX\b|CNPJ|CPF|TRIBUT|ICMS|IMPOSTO|DESCRI[CÇ]|C[OÓ]DIGO|CHAVE|PROTOCOLO|CONSULT|S[EÉ]RIE|EMISS|VALOR PAGO|FORMA|ITENS|LEI 12|ENDERE|TELEFONE|\bIE\b/i;
const ABBR={qjo:"queijo",bisc:"biscoito",refrig:"refrigerante",choc:"chocolate",muss:"mussarela",hussarela:"mussarela",mussarela:"mussarela",iog:"iogurte",ferm:"fermentado",hexerica:"mexerica",req:"requeijão",lte:"leite",sab:"sabonete",deterg:"detergente",desinf:"desinfetante",amac:"amaciante",cx:"caixa",pct:"pacote",tp:"tipo",integ:"integral",cong:"congelado",frgo:"frango",fgo:"frango",bov:"bovino",cerv:"cerveja",manteig:"manteiga",marg:"margarina",refri:"refrigerante",lche:"lanche"};
function cleanName(s){
  s=String(s).replace(/[—–]/g," ");
  const m=s.match(/(?:^|\s)\d{1,3}\s+[A-Z]?\d{4,14}\s+(?=\S)/i); // nº do item + código do produto
  if(m)s=s.slice(m.index+m[0].length);else s=s.replace(/^\s*\d{1,3}\s+/,"").replace(/^\d{4,14}\s+/,"");
  s=s.replace(/^\s*L\.?\s+(FERM|COND|UHT|INTEG|DESN|PO\b)/i,"Leite $1").replace(/[|_~*"'#()\[\]{}+=<>]+/g," ").replace(/\s+/g," ").trim();
  let w=s.split(" ");while(w.length>1&&!/[A-Za-zÀ-ú]{2}/.test(w[0]))w.shift(); // lixo no começo
  while(w.length>1&&(/^(KG|UN|UND|UNID|PC|PCT|CX|LT|FD|BD|SC)$/i.test(w[w.length-1])||/^[A-Z]?\d{1,3}[A-Z]?$/i.test(w[w.length-1])&&!/\d(kg|g|ml|l)$/i.test(w[w.length-1])))w.pop();
  s=w.map(x=>ABBR[x.toLowerCase().replace(/\.$/,"")]||x).join(" ");
  return s.toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/(\d)(kg|g|ml|lt|l)\b/gi,(m,a,b)=>a+({l:"L",lt:"L"}[b.toLowerCase()]||b.toLowerCase())).slice(0,48);
}
function findDate(text){
  const now=new Date(),lines=String(text).split(/\r?\n/);let best=null,bestScore=-1;
  lines.forEach(l=>{for(const m of l.matchAll(/(\d{2})\s?[\/.\-]\s?(\d{2})\s?[\/.\-]\s?(20\d{2}|\d{2})(?!\d)/g)){
    const d=+m[1],mo=+m[2],y=m[3].length===2?2000+ +m[3]:+m[3];if(d<1||d>31||mo<1||mo>12||y<2015)continue;
    const dt=new Date(y,mo-1,d);if(dt-now>864e5)continue;
    const sc=(/EMISS|DATA|HORA|\d{2}:\d{2}/i.test(l)?10:0)+(dt/1e13);
    if(sc>bestScore){bestScore=sc;best=`${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`}}});
  return best||"";
}
const CHAINS=["Prezunic","Guanabara","Assaí Atacadista","Assaí","Mundial","Zona Sul","Supermarket","Carrefour","Pão de Açúcar","Extra","Inter","Atacadão","Sendas","Super Prix","Princesa","Costazul","Hortifruti","Supermercados Unidos","Rede Economia","Bramil","Royal","Dia","Mercadinho São José","Grupo Mateus","Bretas","Big Box","Oba","Hirota","Natural da Terra","Sonda","Dalben","Savegnago","Tauste","Muffato","Condor","Angeloni","Bistek","Comper","Fort Atacadista","Makro","Sam's Club","Spani","Tenda","BH","Epa","Verdemar"];
function goodName(t){t=String(t||"").trim();if(t.replace(/[^A-Za-zÀ-ú]/g,"").length<4)return false;const w=t.split(/\s+/).filter(x=>x.length>1);if(!w.length)return false;
  const bad=w.filter(x=>!/[aeiouyáéíóúãõâêô]/i.test(x)||/\d/.test(x)||/["'`|_~]/.test(x)).length;return bad/w.length<=0.2}
function tidyName(t){return String(t).replace(/\b(LTDA|EIRELI|EPP|ME|S\/?A|CIA|COMERCIO DE ALIMENTOS|COM\.?\s*DE\s*ALIM\w*)\b\.?/gi,"").replace(/[^\wÀ-ú&' .-]/g," ").replace(/\s+/g," ").trim()
  .toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()).slice(0,40)}
function detectStore(text,lines){
  const t=" "+norm(text)+" ";for(const c of CHAINS){if(t.includes(" "+norm(c)+" "))return c}
  const cand=lines.slice(0,8).filter(l=>/SUPERMERC|MERCAD|ATACAD|HORTI|PADARIA|EMPORIO|EMPÓRIO|SACOLAO|SACOLÃO|DROGARIA|FARMACIA|COMERCIO|LTDA|S\/A/i.test(l)&&!/CNPJ|DOCUMENTO|NFC|CUPOM|DANFE|AUXILIAR|CONSUMIDOR|ELETR|EXTRATO|ENDERE|RUA|AV\.|AVENIDA/i.test(l));
  for(const l of cand){const n=tidyName(l);if(goodName(n))return n}
  return "";
}
function parseCupom(text){
  const lines=String(text).split(/\r?\n/).map(l=>l.replace(/\s+/g," ").trim()).filter(l=>l.length>1);
  const out={items:[],store:"",date:"",total:0};
  out.date=findDate(text);
  out.store=detectStore(text,lines);
  const tm=text.match(/(?:VALOR\s*(?:A\s*)?PAGAR|VALOR\s*TOTAL|TOTAL)[^\d\n]{0,20}(\d{1,3}(?:\.\d{3})*,\d{2})/i);if(tm)out.total=num(tm[1]);
  const reQ=/(\d+(?:[.,]\d{1,3})?)\s*(UN|UND|UNID|KG|PC|PCT|CX|LT|L|G|DZ|FD|BD|SC)?\.?\s*[xX×*]\s*(\d{1,4}[.,]\d{2,3})(?:\s*[A-Z]?\s+(\d{1,4}(?:\.\d{3})*[.,]\d{2}))?/i;
  const reEnd=/(\d{1,3}(?:\.\d{3})*,\d{2}|\d+\.\d{2})\s*[A-Z]?\s*$/;
  const L=s=>(String(s).match(/[A-Za-zÀ-ú]/g)||[]).length;
  let pend=null;
  for(const l of lines){
    if(SKIP.test(l)){pend=null;continue}
    const q=l.match(reQ),e=l.match(reEnd);
    if(q){
      let src=l.slice(0,q.index).trim();if(L(src)<3&&pend)src=pend;pend=null;
      let qty=num(q[1]),price=num(q[3]),tot=q[4]?num(q[4]):0;const kg=/^KG$/i.test(q[2]||"")||(!q[2]&&/\bKG\b/i.test(src)&&String(q[1]).match(/[.,]\d{3}$/));
      if(!(qty>0&&qty<1000))qty=tot&&price?Math.round(tot/price*1000)/1000:1;
      if(L(src)>=3&&price>0&&price<10000)out.items.push({name:cleanName(src),qty:kg?qty:Math.max(1,Math.round(qty)),unit:kg?"kg":"un",price,total:tot||Math.round(price*qty*100)/100});
    }else if(e&&L(l.slice(0,e.index))>=3){
      const price=num(e[1]);pend=null;
      if(price>0&&price<10000)out.items.push({name:cleanName(l.slice(0,e.index)),qty:1,unit:"un",price,total:price});
    }else if(L(l)>=3)pend=l;
  }
  return out;
}
function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("script"));document.head.appendChild(s)})}
async function prepImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(2,2000/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height),p=d.data;
    for(let i=0;i<p.length;i+=4){let v=.299*p[i]+.587*p[i+1]+.114*p[i+2];v=(v-140)*1.6+140;v=v<0?0:v>255?255:v;p[i]=p[i+1]=p[i+2]=v}
    x.putImageData(d,0,0);return c;
  }finally{URL.revokeObjectURL(url)}
}
function pickCupom(){ui.screen="nota";render();scrollTo(0,0)}
function readCupom(file){
  sheet(`<h2>Lendo o cupom…</h2><p class="hint" id="c-msg" style="margin:0">Preparando a foto</p><div class="prog"><i id="c-bar"></i></div>
    <p style="color:var(--muted);font-size:14px">Dica: cupom esticado, foto reta, com boa luz e a lista de itens inteira no quadro.</p>`,async(el,close)=>{
    const msg=el.querySelector("#c-msg"),bar=el.querySelector("#c-bar");
    try{
      const canvas=await prepImage(file);
      msg.textContent="Carregando o leitor (demora só na primeira vez)";bar.style.width="15%";
      await loadScript(TESS);
      const worker=await Tesseract.createWorker("por",1,{logger:m=>{if(m.status==="recognizing text"){msg.textContent="Lendo os itens";bar.style.width=Math.round(20+m.progress*80)+"%"}}});
      const {data}=await worker.recognize(canvas);await worker.terminate();
      close();reviewCupom(parseCupom(data.text),data.text,false);
    }catch(e){close();reviewCupom({items:[],store:"",date:"",total:0},"",true)}
  });
}

}

function shareUrl(l){
  const tk=l.items.map(i=>{const k=SHD.findIndex(x=>norm(x[1])===norm(i.name)),du=k>=0?SHD[k][2]:"un",u=i.unit||"un";
    let t=(i.done?"!":"")+(k>=0?B62[Math.floor(k/62)]+B62[k%62]:"~"+(SHC.includes(i.cat)?B62[SHC.indexOf(i.cat)]:"Z")+encN(i.name));
    const q=+i.qty||1;if(q!==1||u!==du)t+="."+qEnc(q)+(u!==du?"."+u:"");return t});
  return APP_URL+"#l="+encN(l.name)+"*"+(l.date?l.date.slice(2).replace(/-/g,""):"")+"*"+tk.join(",")}
function decodeShort(h){const p=h.split("*");if(p.length<3)return null;const d=p[1],it=[];
  (p.slice(2).join("*")).split(",").filter(Boolean).forEach(t=>{let done=false;if(t[0]==="!"){done=true;t=t.slice(1)}
    const f=t.split("."),base=f[0];let name,cat,unit;
    if(base[0]==="~"){cat=SHC[B62.indexOf(base[1])]||"Outros";name=decN(base.slice(2));unit="un"}
    else{const x=SHD[B62.indexOf(base[0])*62+B62.indexOf(base[1])];if(!x)return;name=x[1];cat=SHC[x[0]];unit=x[2]}
    it.push([name,f[1]?qDec(f[1]):1,f[2]||unit,cat,done?1:0])});
  return{n:decN(p[0])||"Lista",d:d.length===6?`20${d.slice(0,2)}-${d.slice(2,4)}-${d.slice(4,6)}`:"",i:it}}
const qtyTxt=(q,u)=>{const t=fmtQty(q,u);return t?` (${t})`:""};
function groupItems(items){const order=[...new Set([...getPlan().map(c=>c.name),...items.map(i=>i.cat||"Itens")])];return order.map(c=>[c,items.filter(i=>(i.cat||"Itens")===c)]).filter(g=>g[1].length)}
function listText(l){
  let t=`🛒 *${l.name}*${l.date&&!l.name.includes(fmtD(l.date))?` · ${fmtD(l.date)}`:""}\n`;
  groupItems(l.items).forEach(([c,its])=>{t+=`\n_${c}_\n`+its.map(i=>`${i.done?"☑":"☐"} ${i.name}${qtyTxt(i.qty,i.unit)}`).join("\n")+"\n"});
  return t+`\nFeito com Compras Mercado`;
}
const slug=t=>norm(t).replace(/\s+/g,"-").slice(0,40)||"lista";
function shareSheet(l){
  if(!l)return;
  const url=shareUrl(l),n=l.items.length,msg=`🛒 *${l.name}*${l.date&&!l.name.includes(fmtD(l.date))?` · ${fmtD(l.date)}`:""}\n${n} ${n===1?"item":"itens"} para marcar no mercado 👇\n${url}`;
  sheet(`<h2>Enviar lista</h2><p style="color:var(--muted)">Quem receber toca no link e a lista abre no celular para ir marcando.</p>
    <a class="share-opt main" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><span class="em">💬</span><span class="t"><b>Enviar pelo WhatsApp</b>Escolha o contato.</span></a>
    <button class="btn" id="sh-copy" style="align-self:center">Copiar link</button>`,(el,close)=>{
    el.querySelector("#sh-copy").onclick=()=>{try{navigator.clipboard.writeText(msg).then(()=>toast("Copiado. É só colar na conversa."),()=>toast("Não deu para copiar aqui."))}catch(e){toast("Não deu para copiar aqui.")}};
  });
}

/* lista recebida por link */
function readShared(){const h=location.hash||"";if(h.startsWith("#l=")){try{const d=decodeShort(h.slice(3));return d&&d.i.length?d:null}catch(e){return null}}if(!h.startsWith("#lista="))return null;try{const d=JSON.parse(unb64u(h.slice(7)));return d&&Array.isArray(d.i)?d:null}catch(e){return null}}
const shKey=()=>"cm-sh-"+hashStr(location.hash||"");
function shState(){try{return JSON.parse(localStorage.getItem(shKey()))||{}}catch(e){return{}}}
function renderShared(){
  const d=ui.shared,st=shState(),plan=getPlan();
  const items=d.i.map((x,j)=>({j,name:x[0],qty:x[1],unit:x[2],cat:x[3]||"Itens",done:j in st?st[j]:!!x[4]}));
  const n=items.filter(i=>i.done).length,pct=items.length?Math.round(n/items.length*100):0;
  const em=c=>(plan.find(x=>x.name===c)||DEFAULT_PLAN.find(x=>x.name===c)||{}).em||"🛍️";
  return `<div class="screen">
    <div class="lhd"><div class="row" style="align-items:center;gap:12px"><div style="width:64px;flex:none">${MASCOT}</div><div style="min-width:0"><span class="sub" style="font-weight:700;letter-spacing:.12em;font-size:12px">LISTA RECEBIDA</span><h2>${esc(d.n)}</h2>${d.d?`<div class="sub">${fmtLong(d.d)}</div>`:""}</div></div>
      <div class="shbar"><i style="width:${pct}%"></i></div><div class="sub" style="font-weight:700">${n} de ${items.length} no carrinho${n===items.length&&n?" · tudo pronto! 🎉":""}</div></div>
    ${groupItems(items).map(([c,its])=>`<p class="csec">${em(c)} ${esc(c)}</p><ul class="items">${its.map(i=>{const ql=fmtQty(i.qty,i.unit);return `<li class="ipill ${i.done?"done":""}"><button class="ck" data-shk="${i.j}" aria-pressed="${!!i.done}" aria-label="${i.done?"Desmarcar":"Marcar"} ${esc(i.name)}">${i.done?ic("check",22):""}</button><button class="nm" data-shk="${i.j}">${esc(i.name)}${ql?`<small>${esc(ql)}</small>`:""}</button></li>`}).join("")}</ul>`).join("")}
    <button class="cta alt" data-act="sh-save" style="margin-top:8px">Salvar nas minhas listas</button>
    ${S.onboarded?`<button class="link" data-act="sh-close" style="align-self:center">Abrir meu app</button>`:""}
    <p class="hint" style="text-align:center;margin:0">Feito com Compras Mercado · DomDevLabs</p></div>`;
}
function bindShared(A){
  A.querySelectorAll("[data-shk]").forEach(b=>b.onclick=()=>{const st=shState(),j=+b.dataset.shk,cur=j in st?st[j]:!!ui.shared.i[j][4];st[j]=!cur;
    try{localStorage.setItem(shKey(),JSON.stringify(st))}catch(e){}const y=scrollY;render();scrollTo(0,y)});
  const leave=()=>{try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}};
  A.querySelectorAll("[data-act=sh-close]").forEach(b=>b.addEventListener("click",()=>{leave();ui.screen="home";render()}));
  A.querySelectorAll("[data-act=sh-save]").forEach(b=>b.addEventListener("click",()=>{const d=ui.shared,st=shState();
    const l={id:uid(),name:d.n||"Lista recebida",date:d.d||todayISO(),color:"sky",em:"🛒",stage:"mercado",items:d.i.map((x,j)=>({id:uid(),name:x[0],qty:x[1]||1,unit:x[2]||"un",cat:x[3]||"",price:lastPrice(x[0]),size:null,done:j in st?!!st[j]:!!x[4]}))};
    if(!S.onboarded){S.onboarded=true;S.theme="system";delete S.obDraft}
    S.lists.unshift(l);save();leave();ui.listId=l.id;ui.screen="list";render();scrollTo(0,0);toast("Lista salva no seu app.")}));
}
window.addEventListener("hashchange",()=>{const d=readShared();if(d){ui.shared=d;ui.screen="shared";render();scrollTo(0,0)}});

/* ---------- Backup ---------- */
function backupCode(){const d={...S};delete d.obDraft;return "CM1:"+btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
function readBackup(txt){let t=String(txt||"").trim();if(!t)return null;try{if(t.startsWith("CM1:"))t=decodeURIComponent(escape(atob(t.slice(4).replace(/\s/g,""))));const d=JSON.parse(t);return d&&Array.isArray(d.lists)?d:null}catch(e){return null}}
function backupSheet(){
  S.lastBackup=Date.now();save();const code=backupCode();
  sheet(`<h2>Backup</h2><p style="color:var(--muted)">Copie o código abaixo e guarde onde quiser: WhatsApp para você mesmo, Notas ou e-mail. Para recuperar, use <b>Restaurar backup</b> e cole o código.</p>
    <textarea id="bk-code" readonly>${esc(code)}</textarea>
    <button class="cta alt" id="bk-copy">Copiar código</button>`,(el,close)=>{
    const ta=el.querySelector("#bk-code");
    el.querySelector("#bk-copy").onclick=()=>{const sel=()=>{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length)};
      try{navigator.clipboard.writeText(code).then(()=>{toast("Backup copiado.");close()},()=>{sel();toast("Código selecionado. É só copiar.")})}catch(e){sel();toast("Código selecionado. É só copiar.")}};
  });
}
function restoreSheet(fromWelcome){
  sheet(`<h2>${fromWelcome?"Já usou antes?":"Restaurar backup"}</h2>
    <p style="color:var(--muted)">Cole o código de backup que você copiou em Ajustes. Suas listas, preços e preferências voltam como estavam.</p>
    <textarea id="rs-code" placeholder="Cole aqui o código (começa com CM1:)"></textarea>
    <button class="cta alt" id="rs-go">Restaurar</button>
    ${fromWelcome?`<button class="btn" id="rs-skip" style="align-self:center">Não tenho backup, começar agora</button>`:""}`,(el,close)=>{
    el.querySelector("#rs-go").onclick=()=>{const d=readBackup(el.querySelector("#rs-code").value);
      if(!d){toast("Código inválido. Confira se copiou ele inteiro.");return}
      S=Object.assign(blank(),d,{onboarded:true});delete S.obDraft;save();applyTheme(S.theme);close();ui.screen="home";render();scrollTo(0,0);
      toast(`Backup restaurado: ${S.lists.length} ${S.lists.length===1?"lista":"listas"}.`)};
    const sk=el.querySelector("#rs-skip");if(sk)sk.onclick=()=>{close();finishOnb()};
  });
}

/* ---------- Instalar no celular (PWA) ---------- */
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isMobile=()=>isIOS()||/android/i.test(navigator.userAgent);
const showInstall=()=>!EMBED&&!isStandalone()&&(!!deferredPrompt||isMobile());
const installSnoozed=()=>S.installSnooze&&Date.now()-S.installSnooze<7*864e5;
function installCard(){return `<div class="promo c-sky"><span class="em">📲</span><span class="t"><b>Instale no celular</b>Abre direto da tela inicial, como app, e funciona sem internet.</span>
  <span class="side"><button class="btn dark" data-act="install">Instalar</button><button class="link" data-act="install-later">Agora não</button></span></div>`}
async function doInstall(){
  if(deferredPrompt){const p=deferredPrompt;deferredPrompt=null;p.prompt();const r=await p.userChoice.catch(()=>null);if(r&&r.outcome==="accepted")toast("Instalando…");render();return}
  const ios=isIOS(),inApp=/Instagram|FBAN|FBAV|WhatsApp|Line\/|TikTok/i.test(navigator.userAgent);
  sheet(`<h2>Instalar no ${ios?"iPhone":"Android"}</h2>
    ${inApp?`<div class="alert"><b>Abra no ${ios?"Safari":"Chrome"} primeiro.</b> Você está no navegador de outro app. Toque em ··· ou ⋮ e escolha "Abrir no ${ios?"Safari":"navegador"}".</div>`:""}
    <ol class="steps">${ios
      ?`<li>Toque em <b>Compartilhar</b>, o quadrado com a seta ↑ na barra do Safari.</li><li>Role a lista e toque em <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>. O ícone aparece junto dos seus apps.</li>`
      :`<li>Toque no menu <b>⋮</b> do Chrome, no canto de cima.</li><li>Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li><li>Confirme em <b>Instalar</b>. O ícone aparece junto dos seus apps.</li>`}</ol>
    <button class="cta" id="i-ok">Entendi</button>`,(el,close)=>{el.querySelector("#i-ok").onclick=close});
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;render()});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;toast("App instalado na tela inicial.");render()});
if("serviceWorker" in navigator&&!EMBED&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
idbGet(KEY).then(raw=>{
  if(!raw)return;let d;try{d=JSON.parse(raw)}catch(e){return}
  const cur=JSON.stringify(S);if(raw===cur)return;
  // só recupera se aqui não há cadastro feito, ou se a cópia tem mais conteúdo
  if(!S.onboarded&&(d.onboarded||d.obDraft)){S=Object.assign(blank(),d);try{localStorage.setItem(KEY,raw)}catch(e){}
    applyTheme(S.onboarded?S.theme:(S.obDraft?.ob?.theme||"dark"));
    if(ui.screen!=="shared")ui.screen=S.onboarded?"home":"onb";ui.step=S.obDraft?.step||0;if(S.obDraft?.ob)ui.ob=S.obDraft.ob;render()}
  else if(S.onboarded)idbSet(KEY,cur);
});
$("#cupom-file").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)readCupom(f)});

render();
</script>
