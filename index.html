<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF3D68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compras">
<title>Compras Mercado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna (max 480px), telas trocadas por JS, pílulas coloridas como elemento principal */
:root{
  --bg:#FFFBF7; --surface:#F3EEE8; --card:#FFFFFF; --fg:#1A1512; --muted:#6F655E; --line:#E6DED6;
  --ink:#1A1512; --on-ink:#FFFBF7;
  --tomato:#FF3D68; --mint:#9BF0C8; --sky:#A9C8FF; --peach:#FFC79A; --sun:#FFE45C; --lilac:#D8B8FF;
  --pill-fg:#1A1512; --good:#178A4E; --bad:#D6342B;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0C0B; --surface:#1C1917; --card:#211D1A; --fg:#F7F1EB; --muted:#A79C93; --line:#2F2925;
  --ink:#F7F1EB; --on-ink:#0E0C0B; --good:#4BD48A; --bad:#FF6B5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0C0B; --surface:#1C1917; --card:#211D1A; --fg:#F7F1EB; --muted:#A79C93; --line:#2F2925;
  --ink:#F7F1EB; --on-ink:#0E0C0B; --good:#4BD48A; --bad:#FF6B5E; color-scheme:dark}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.screen{flex:1;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.iconbtn:hover{background:var(--surface)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .25s}
.dots i.on{background:var(--fg)}
.dots i.cur{width:28px;background:var(--fg)}
.link{color:var(--muted);font-weight:600;padding:10px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8.5vw,42px);line-height:1.02;letter-spacing:-.02em;text-align:center;text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);text-align:center;margin:-8px 0 0;line-height:1.45}
.hero{flex:1;display:grid;place-items:center;min-height:180px;position:relative}
.cta{width:100%;height:60px;border-radius:99px;background:var(--ink);color:var(--tomato);font-weight:700;font-size:19px}
.cta.alt{background:var(--tomato);color:#1A1512}
.cta:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:12px;align-items:center}
.ghost{font-weight:700;padding:0 18px;height:60px}

/* Mascote: morango original */
.mascot{--s:150px;width:var(--s);height:var(--s);position:relative;animation:bob 3s ease-in-out infinite}
.mascot .body{position:absolute;inset:16% 8% 0;border-radius:46% 46% 50% 50% / 36% 36% 64% 64%;
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.5) 0 6%,transparent 16%),
    radial-gradient(circle,#FFE59A 0 calc(var(--s)*.012),transparent calc(var(--s)*.017)) 0 0/calc(var(--s)*.15) calc(var(--s)*.14),
    radial-gradient(circle,#FFE59A 0 calc(var(--s)*.012),transparent calc(var(--s)*.017)) calc(var(--s)*.075) calc(var(--s)*.07)/calc(var(--s)*.15) calc(var(--s)*.14),
    linear-gradient(170deg,#FF5A78,#E8193C 60%,#C0102E);
  box-shadow:0 0 calc(var(--s)*.35) rgba(255,61,104,.45)}
.mascot .leaf{position:absolute;left:50%;top:5%;width:54%;height:24%;transform:translateX(-50%);z-index:1;background:#2FA35A;
  clip-path:polygon(50% 0,58% 38%,98% 28%,68% 58%,88% 100%,50% 74%,12% 100%,32% 58%,2% 28%,42% 38%)}
.mascot .leaf::before{left:0;transform:rotate(-15deg)}
.mascot .leaf::after{right:0;transform:scaleX(-1) rotate(-15deg)}
.mascot .eye{position:absolute;top:44%;z-index:1;width:7%;height:17%;background:#1A1512;border-radius:99px;animation:blink 4.5s infinite}
.mascot .eye.l{left:36%}.mascot .eye.r{right:36%}
.mascot .cheek{position:absolute;top:62%;width:12%;height:7%;border-radius:50%;background:#FFB3C2;opacity:.85;z-index:1}
.mascot .cheek.l{left:22%}.mascot .cheek.r{right:22%}
.mascot.think .eye{height:12%;top:46%}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.mascot,.mascot .eye{animation:none}}
.float{position:absolute;font-size:34px;filter:saturate(1.1)}

/* Tema */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{border-radius:28px;padding:12px 12px 16px;text-align:left;border:3px solid transparent;display:flex;flex-direction:column;gap:12px;font-weight:700}
.tcard.light{background:#fff;color:#1A1512;border-color:#E6DED6}
.tcard.dark{background:#1C1917;color:#F7F1EB;border-color:#2F2925}
.tcard.sel{border-color:var(--tomato)}
.tprev{border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:5px}
.light .tprev{background:#F3EEE8}.dark .tprev{background:#0E0C0B}
.tprev b{display:block;height:16px;border-radius:99px}
.tprev b:first-child{height:30px}

/* Chips */
.group{display:flex;flex-direction:column;gap:10px}
.glabel{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--muted);text-transform:uppercase;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 16px;border-radius:99px;background:var(--surface);font-weight:600;border:2px solid transparent}
.chip.on{background:var(--ink);color:var(--on-ink)}

/* Pílulas de lista */
.pills{display:flex;flex-direction:column;gap:8px}
.pill{min-height:72px;border-radius:99px;padding:0 22px 0 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:20px;font-weight:600;color:var(--pill-fg);border:3px solid transparent;text-align:left;width:100%}
.pill.sel{border-color:var(--fg)}
.pill .em{font-size:28px}
.pill small{display:block;font-size:13px;font-weight:500;opacity:.7}
.pillin{min-height:72px;border-radius:99px;background:var(--surface);border:3px solid transparent;padding:0 26px;font-size:19px;width:100%}
.pillin.sel{border-color:var(--fg)}
.c-tomato{background:var(--tomato)}.c-mint{background:var(--mint)}.c-sky{background:var(--sky)}
.c-peach{background:var(--peach)}.c-sun{background:var(--sun)}.c-lilac{background:var(--lilac)}

/* Home */
.greet{display:flex;gap:14px;align-items:center}
.bubble{background:var(--surface);border-radius:20px 20px 20px 6px;padding:12px 14px;line-height:1.4;flex:1;min-width:0}
.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);
  padding:10px 0 calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px;border-radius:14px}
.tab span{font-size:20px}
.tab.on{color:var(--fg);background:var(--surface)}
.add-list{border:2px dashed var(--line);border-radius:99px;min-height:64px;font-weight:700;color:var(--muted)}

/* Lista */
.lhead{border-radius:32px;padding:18px 20px;color:#1A1512;display:flex;flex-direction:column;gap:10px}
.lhead h2{font-size:28px}
.bar{height:8px;background:rgba(26,21,18,.15);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:#1A1512;border-radius:99px;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.adder{display:flex;gap:8px}
.adder textarea{flex:1;min-width:0;border-radius:24px;background:var(--surface);border:2px solid transparent;padding:14px 18px;resize:none;height:54px;font:inherit;color:inherit}
.adder textarea:focus{border-color:var(--fg);outline:none;height:110px}
.round{width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:22px;flex:none;display:grid;place-items:center}
.round.mic{background:var(--surface);color:var(--fg)}
.round.mic.rec{background:var(--tomato);color:#1A1512}
.hint{font-size:13px;color:var(--muted);margin:-12px 4px 0}
.items{display:flex;flex-direction:column;gap:6px;list-style:none;padding:0;margin:0}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px 12px 10px 10px}
.check{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--fg);flex:none;display:grid;place-items:center;font-size:16px;font-weight:800}
.item.done .check{background:var(--tomato);border-color:var(--tomato);color:#1A1512}
.item.done .iname{text-decoration:line-through;color:var(--muted)}
.ibody{flex:1;min-width:0;text-align:left}
.iname{font-weight:600;overflow-wrap:anywhere}
.isub{font-size:13px;color:var(--muted)}
.iprice{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.iprice.empty{color:var(--muted);font-weight:500;font-size:14px}
.sec{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--muted);text-transform:uppercase;margin:6px 4px 0}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sugg .chip{white-space:nowrap;flex:none}
.empty{text-align:center;color:var(--muted);padding:24px 8px;display:flex;flex-direction:column;align-items:center;gap:12px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select{height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:0 14px;font-size:17px;color:var(--fg);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.danger{color:var(--bad);font-weight:700;padding:12px}

/* Insights */
.kpi{border-radius:28px;padding:20px;background:var(--sun);color:#1A1512;display:flex;flex-direction:column;gap:4px}
.kpi .big{font-family:var(--f-display);font-weight:800;font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.prow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.prow>div:first-child{min-width:0}
.delta{font-weight:700;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:99px;font-size:14px;white-space:nowrap}
.delta.up{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.delta.down{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.delta.eq{background:var(--surface);color:var(--muted)}
.alert{border-radius:22px;padding:14px 16px;background:var(--lilac);color:#1A1512;line-height:1.4}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:18px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars b{width:100%;border-radius:10px 10px 4px 4px;background:var(--sky);min-height:4px}
.bars div.cur b{background:var(--tomato)}
.spark{width:100%;height:40px}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--surface);color:var(--muted);padding:3px 8px;border-radius:99px}

/* Novos blocos */
.promo{border-radius:28px;padding:16px 18px;display:flex;align-items:center;gap:14px;color:#1A1512;text-align:left;width:100%}
.promo .t{flex:1;min-width:0;line-height:1.35;font-size:14px}
.promo .t b{display:block;font-size:17px;margin-bottom:2px}
.promo .em{font-size:30px;flex:none}
.promo .side{display:flex;flex-direction:column;gap:2px;align-items:center;flex:none}
.promo .link{color:#1A1512;opacity:.7;font-size:13px;padding:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 18px;border-radius:99px;background:var(--surface);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn.dark{background:var(--ink);color:var(--on-ink)}
.promo .btn.dark{background:#1A1512;color:#FFFBF7}
.stepper{display:flex;align-items:center;gap:16px;justify-content:center}
.stepper button{width:52px;height:52px;border-radius:50%;background:var(--surface);font-size:24px;font-weight:700}
.stepper output{font-family:var(--f-display);font-weight:800;font-size:44px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;line-height:1.45}
.prog{height:10px;background:var(--surface);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:4%;background:var(--tomato);transition:width .2s}
.rvh,.rv{display:grid;grid-template-columns:26px minmax(0,1fr) 92px;gap:8px;align-items:center}
.rvh{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rv{padding:6px 0;border-bottom:1px solid var(--line)}
.rv input[type=text],.rv input[type=number]{height:42px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 10px;font-size:15px;color:var(--fg);min-width:0;width:100%}
.rv input[type=checkbox]{width:22px;height:22px;accent-color:var(--tomato)}
.sheet textarea{border-radius:16px;border:2px solid var(--line);background:var(--card);padding:12px;min-height:130px;width:100%;font:inherit;color:var(--fg);resize:vertical}
.sheet p{margin:0;line-height:1.45}
.est{font-size:13px;opacity:.75}
.pctbar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface)}
.pctbar i{display:block;min-width:0}
.pname{flex:1;min-width:0;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 12px;font-weight:700;font-size:17px;color:var(--fg)}
.ppct{display:flex;align-items:center;gap:4px;font-weight:700;flex:none}
.ppct input{width:64px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 8px;font-size:16px;color:var(--fg);text-align:right}
.cem{font-size:24px;flex:none}
.chip.ed{display:inline-flex;align-items:center;gap:6px;padding:7px 7px 7px 14px}
.chip.ed button{width:24px;height:24px;border-radius:50%;background:var(--line);font-size:12px;display:grid;place-items:center}
.chip.ed small{color:var(--muted);font-weight:500}
.padd{flex:1;min-width:0;height:46px;border-radius:99px;border:2px solid var(--line);background:var(--card);padding:0 16px;color:var(--fg)}
.over{color:var(--bad)}
.dev{display:flex;align-items:center;gap:14px}
.dev img{width:96px;height:96px;object-fit:contain;flex:none;border-radius:16px;background:#fff}
.mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mail code{font-family:inherit;font-weight:700;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.pickbar{position:sticky;bottom:0;margin-top:auto;padding:14px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.chip.pk.on::before{content:"✓ "}
.pkh{display:flex;gap:2px;flex:none}
.pkh .link{padding:4px 6px;font-size:13px}
.pkh .link.on{color:var(--fg);text-decoration:underline}
.chip.pkplus{border:2px dashed var(--line);background:none;color:var(--muted)}
.pkg.editing{background:var(--surface);border-radius:20px;padding:12px;margin-inline:-12px}
.pkg.editing .chip.ed{background:var(--card)}
.pkg .prow{align-items:center}
.ldate{font-weight:600;font-size:15px}
.credit{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--muted);font-size:13px;padding:8px}
.credit svg{width:28px;height:28px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:99px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>

</head>
<body>
<div id="app"></div>
<input type="file" id="cupom-file" accept="image/*" hidden>

<script>
const VERSION = "1.6.0";
const KEY = "compras-mercado.v1";
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const brl = n => (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const COLORS = ["tomato","mint","sky","peach","sun","lilac"];
const TEMPLATES = {
  "Mercado do mês":{em:"🛒",color:"mint",items:["Arroz 5kg","Feijão","Café","Açúcar","Óleo","Papel higiênico","Sabão em pó","Leite"]},
  "Churrasco":{em:"🔥",color:"lilac",items:["Picanha","Linguiça","Pão de alho","Carvão","Sal grosso","Gelo","Farofa pronta"]},
  "Feira":{em:"🍅",color:"peach",items:["Tomate","Cebola","Banana","Alface","Batata","Ovos","Laranja"]},
  "Farmácia":{em:"💊",color:"sun",items:["Pasta de dente","Fio dental","Protetor solar","Curativo"]},
};
const PREFS = {
  "Alimentação":["Sou vegano","Vegetariano","Sem lactose","Sem glúten","Low carb","Mais proteína"],
  "Saúde":["Tenho diabetes","Menos sal","Alergia a castanhas","Alergia a frutos do mar"],
  "Casa":["Tenho pet","Tem bebê","Tem criança","Moro sozinho"],
};
const PREF_SUGG = {
  "Sou vegano":["Tofu","Grão-de-bico","Leite de aveia"],"Vegetariano":["Ovos","Queijo","Lentilha"],
  "Sem lactose":["Leite sem lactose","Iogurte sem lactose"],"Sem glúten":["Pão sem glúten","Tapioca"],
  "Low carb":["Ovos","Abobrinha","Frango"],"Mais proteína":["Peito de frango","Ovos","Whey"],
  "Tenho diabetes":["Adoçante","Aveia"],"Menos sal":["Temperos naturais","Limão"],
  "Tenho pet":["Ração","Areia sanitária"],"Tem bebê":["Fraldas","Lenço umedecido"],
  "Tem criança":["Lanche escolar","Suco de caixinha"],"Moro sozinho":["Congelados","Pão de forma"],
};
const BLOCK = {"Sou vegano":["Leite","Ovos","Queijo","Picanha","Linguiça","Frango","Peito de frango","Whey"],
  "Vegetariano":["Picanha","Linguiça","Frango","Peito de frango"],"Sem lactose":["Leite","Queijo"],

/* ---------- Parsing de texto/receita ---------- */
function parseItems(txt){
  return txt.split(/\n|,|;| e (?=[A-ZÁÉÍÓÚa-záéíóú])/).map(s=>s.replace(/^\s*(?:[-•*·]|\d+[.)])\s*/,"").trim()).filter(Boolean).map(s=>{
    let qty=1,name=s,m;
    if((m=s.match(/^(\d+[.,]?\d*)\s*(?:x\s*)?(.+)$/i))){qty=parseFloat(m[1].replace(",","."));name=m[2]}
    else if((m=s.match(/^(.+?)\s*x\s*(\d+)$/i))){name=m[1];qty=+m[2]}
    name=name.replace(/^(de|do|da)\s+/i,"").replace(/\s+/g," ");
    name=name.charAt(0).toUpperCase()+name.slice(1);
    return {id:uid(),name,qty:qty||1,price:lastPrice(name),size:null,unit:"un",done:false};
  }).filter(i=>i.name.length>1);
}
function blocked(name){if(/aveia|vegetal|sem lactose|sem glúten|de soja|de coco|de amêndoa/i.test(name))return false;return S.prefs.some(p=>(BLOCK[p]||[]).some(b=>name.toLowerCase().startsWith(b.toLowerCase())))}

function monthKey(d){return d.slice(0,7)}
function renderInsights(){
  const H=S.history,P=S.purchases;
  if(!H.length) return `<div class="screen"><div class="topbar"><h2>Quanto sua cesta subiu</h2></div>
    <div class="empty">${mascot(110,"think")}<p>Quando você finalizar uma compra com preços, eu mostro aqui a variação de cada produto, o gasto do mês e quando a embalagem encolheu.</p>
    <button class="cta alt" data-act="cupom">📷 Ler cupom fiscal</button><button class="cta" data-act="sample">Ver com dados de exemplo</button></div>${tabs("insights")}</div>`;
  const now=new Date(),months=[];for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);months.push(d.toISOString().slice(0,7))}
  const byM=Object.fromEntries(months.map(m=>[m,0]));P.forEach(p=>{const m=monthKey(p.date);if(m in byM)byM[m]+=p.total});
  const max=Math.max(1,...Object.values(byM)),cur=byM[months[5]],prev=byM[months[4]];
  const groups={};H.forEach(h=>{(groups[h.name.toLowerCase()]??=[]).push(h)});
  const prods=Object.values(groups).map(g=>{g.sort((a,b)=>a.date.localeCompare(b.date));const f=g[0],l=g[g.length-1];
    const unitF=f.size?f.price/f.size:f.price,unitL=l.size?l.price/l.size:l.price;
    return{name:l.name,g,last:l.price,pct:(unitL/unitF-1)*100,shrink:f.size&&l.size&&l.size<f.size&&l.price>=f.price*0.98?{f,l}:null}}).sort((a,b)=>b.pct-a.pct);
  const shr=prods.filter(p=>p.shrink);
  const mn=m=>new Date(m+"-02").toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
  const spark=g=>{if(g.length<2)return"";const v=g.map(h=>h.size?h.price/h.size:h.price),lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1;
    const pts=v.map((x,i)=>`${(i/(v.length-1)*100).toFixed(1)},${(36-(x-lo)/r*32).toFixed(1)}`).join(" ");
    return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--tomato)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`};
  const d=p=>{const c=Math.abs(p)<0.5?"eq":p>0?"up":"down";return `<span class="delta ${c}">${c==="eq"?"=":(p>0?"▲ ":"▼ ")+Math.abs(p).toFixed(1).replace(".",",")+"%"}</span>`};
  return `<div class="screen"><div class="topbar"><h2>Quanto sua cesta subiu</h2>${S.sample?`<span class="tag">exemplo</span>`:""}</div>
    <button class="btn dark" data-act="cupom" style="align-self:flex-start">📷 Ler cupom fiscal</button>
    <div class="kpi"><span style="font-weight:600">Gasto em ${mn(months[5])}</span><span class="big">${brl(cur)}</span>
      <span>${prev?`${cur>=prev?"▲":"▼"} ${brl(Math.abs(cur-prev))} vs ${mn(months[4])}`:"Primeiro mês registrado"}</span></div>

function finishOnb(){
  const o=ui.ob;S.theme=o.theme;S.prefs=o.prefs;S.tone=o.tone;S.name=o.name.trim();S.onboarded=true;
  const name=o.custom.trim()||o.first,t=TEMPLATES[name];
  const l={id:uid(),name,color:t?.color||"sky",em:t?.em||"🧺",items:[]};
  if(name==="Mercado do mês"){l.items=monthItems(defaultPeople());l.month=true}
  else (t?.items||[]).filter(n=>!blocked(n)).slice(0,4).forEach(n=>l.items.push({id:uid(),name:n,qty:1,price:lastPrice(n),size:null,unit:"un",done:false}));
  S.lists.push(l);save();applyTheme(S.theme);ui.listId=l.id;ui.screen="list";render();toast(tone().add);
}
function checkout(l){
  const done=l.items.filter(i=>i.done),date=l.date||todayISO();
  const total=done.reduce((a,i)=>a+(i.price||0)*i.qty,0);
  if(!l.cupomSaved){done.filter(i=>i.price).forEach(i=>S.history.push({name:i.name,price:i.price,size:i.size,sizeUnit:i.sizeUnit,date,list:l.name}));
    if(total)S.purchases.push({date,total,list:l.name});}
  // mantém os itens na lista para a próxima compra, desmarcados e com o último preço
  if(l.date){l.closed=true;ui.screen="home"}else done.forEach(i=>i.done=false);
  if(S.sample){S.history=S.history.filter(h=>!h.sample);S.purchases=S.purchases.filter(p=>!p.sample);S.sample=false}
  save();render();toast(tone().done+(total?" "+brl(total):""));
}

let rec=null;

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Voz não disponível neste navegador. Digite ou cole a lista.");return}

/* ---------- Lista padrão do mês ---------- */
function defaultPeople(){return S.people||(S.prefs.includes("Moro sozinho")?1:2+(S.prefs.includes("Tem criança")?1:0))}
function getPlan(){return S.plan||JSON.parse(JSON.stringify(DEFAULT_PLAN))}
function monthItems(people){
  const P=S.prefs,vegan=P.includes("Sou vegano"),pet=P.includes("Tenho pet"),bebe=P.includes("Tem bebê");
  const plan=getPlan();if(!plan.length)return [];
  const catBy=(re,fb)=>(plan.find(c=>re.test(c.name))||plan[fb]||plan[0]).name;
  const PROT=catBy(/prote/i,0),HORT=catBy(/horti/i,1),MERC=catBy(/merce/i,2),PAD=catBy(/padar|matin/i,4);
  let rows=[];
  plan.forEach(c=>c.items.forEach(it=>{if(it.need==="pet"&&!pet)return;if(it.need==="bebe"&&!bebe)return;rows.push([c.name,it.name,it.unit||"un",it.pp??.5,it.min??1])}));
  const swap=(a,b)=>rows.forEach(r=>{if(r[1]===a)r[1]=b});
  const drop=re=>{rows=rows.filter(r=>!re.test(r[1]))};
  if(P.includes("Sem lactose")){swap("Leite 1L","Leite sem lactose 1L");swap("Iogurte","Iogurte sem lactose");swap("Queijo muçarela 200g","Queijo sem lactose");swap("Requeijão","Requeijão sem lactose")}
  if(P.includes("Sem glúten")){swap("Macarrão 500g","Macarrão sem glúten");swap("Pão de forma","Pão sem glúten");swap("Biscoito","Biscoito sem glúten");swap("Torrada","Torrada sem glúten");swap("Aveia","Tapioca")}
  if(vegan){swap("Leite 1L","Leite vegetal 1L");swap("Leite sem lactose 1L","Leite vegetal 1L");
    drop(/^(Carne|Frango|Peixe|Ovos|Linguiça|Embutidos|Manteiga|Queijo|Iogurte|Requeijão|Presunto|Peito de peru|Pão de queijo)/);
    rows.push([PROT,"Tofu","un",1,1],[PROT,"Grão-de-bico","pct",.5,1],[PROT,"Proteína de soja","pct",.5,1])}
  else if(P.includes("Vegetariano")){drop(/^(Carne|Frango|Peixe|Linguiça|Embutidos|Presunto|Peito de peru)/);rows.push([PROT,"Grão-de-bico","pct",.5,1],[PROT,"Lentilha","pct",.5,1])}
  if(P.includes("Mais proteína")&&!vegan)rows.push([PROT,"Peito de frango","kg",1,1]);
  if(P.includes("Low carb"))drop(/^(Biscoito|Açúcar|Macarrão|Refrigerante|Cereal)/);
  if(P.includes("Tenho diabetes")){drop(/^(Açúcar|Refrigerante)/);rows.push([MERC,"Adoçante","un",0,1])}
  if(P.includes("Menos sal"))rows.push([HORT,"Temperos naturais","un",0,2]);
  if(P.includes("Tem criança"))rows.push([PAD,"Lanche escolar","pct",0,4],[PAD,"Suco de caixinha","un",0,8]);
  if(P.includes("Alergia a frutos do mar"))drop(/atum|camar/i);
  const hide=new Set(plan.flatMap(c=>c.hide||[]).map(norm));rows=rows.filter(r=>!hide.has(norm(r[1])));
  return rows.filter(r=>!blocked(r[1])).map(([cat,name,unit,pp,min])=>({id:uid(),name,cat,unit,
    qty:unit==="kg"?Math.max(min,Math.round(pp*people*2)/2):Math.max(min,Math.ceil(pp*people-1e-9)),
    price:lastPrice(name),size:null,done:false})).filter(i=>i.qty>0);
}
function monthSheet(){
  let n=defaultPeople();
  sheet(`<h2>Lista padrão do mês</h2>
    <p style="color:var(--muted)">Monto a compra de 30 dias pela sua divisão do mês: proteínas, hortifrúti, mercearia, laticínios, padaria, bebidas, congelados, limpeza, higiene, utilidades e pets/bebê.</p>
    <p class="glabel" style="text-align:center">Quantas pessoas na casa?</p>
    <div class="stepper"><button id="m-minus" aria-label="Menos uma pessoa">−</button><output id="m-n">${n}</output><button id="m-plus" aria-label="Mais uma pessoa">+</button></div>
    <label class="field">Orçamento do mês (opcional)<input id="m-budget" type="number" inputmode="decimal" min="0" step="10" value="${S.budget||""}" placeholder="ex.: 1200"></label>
    <button class="cta alt" id="m-go">Montar minha lista</button>
    <button class="link" id="m-plan" style="align-self:center">Ver e editar a divisão por categoria</button>`,(el,close)=>{
    const o=el.querySelector("#m-n");
    el.querySelector("#m-minus").onclick=()=>{n=Math.max(1,n-1);o.textContent=n};
    el.querySelector("#m-plus").onclick=()=>{n=Math.min(12,n+1);o.textContent=n};
    el.querySelector("#m-plan").onclick=()=>{S.budget=parseFloat(el.querySelector("#m-budget").value)||0;save();close();ui.screen="plan";render();scrollTo(0,0)};
    el.querySelector("#m-go").onclick=()=>{
      S.people=n;S.budget=parseFloat(el.querySelector("#m-budget").value)||0;const mes=new Date().toLocaleDateString("pt-BR",{month:"long"});
      const l={id:uid(),name:`Compra do mês · ${mes}`,color:"mint",em:"📅",month:true,items:monthItems(n)};
      S.lists.unshift(l);save();close();ui.listId=l.id;ui.screen="list";render();scrollTo(0,0);toast(`${l.items.length} itens para ${n} ${n>1?"pessoas":"pessoa"}.`)};
  });
}

/* ---------- Nova lista com data: escolher itens da relação ---------- */
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
const fmtD=iso=>iso.slice(8,10)+"/"+iso.slice(5,7);
const fmtLong=iso=>new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
const defName=iso=>`Mercado · ${fmtD(iso)}`;
function relation(){
  const base=monthItems(1).map(i=>({cat:i.cat,name:i.name,unit:i.unit}));
  const seen=new Set(base.map(i=>norm(i.name)));

  return base;
}

/* ---------- Preços: casar nomes ---------- */
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function matches(item,product){const w=norm(item).split(" ").filter(x=>x.length>=3&&!/^\d/.test(x));if(!w.length)return false;return (" "+norm(product)+" ").includes(" "+w[0])}
function lastPrice(name){for(let i=S.history.length-1;i>=0;i--){const h=S.history[i];if(!h.sample&&(norm(h.name)===norm(name)||matches(name,h.name)))return h.price}return null}
function sizeOf(name){const m=String(name).match(/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|lt|l)\b/i);if(!m)return null;let u=m[2].toLowerCase();if(u==="lt")u="L";if(u==="l")u="L";return{size:parseFloat(m[1].replace(",",".")),unit:u}}

/* ---------- Cupom fiscal ---------- */
function num(s){return parseFloat(String(s).replace(/\s/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."))}
const SKIP=/TOTAL|PAGAR|SUBTOTAL|DESCONTO|ACRESC|TROCO|DINHEIRO|CART[AÃ]O|CR[EÉ]DITO|D[EÉ]BITO|\bPIX\b|CNPJ|CPF|TRIBUT|ICMS|IMPOSTO|DESCRI[CÇ]|C[OÓ]DIGO|CHAVE|PROTOCOLO|CONSULT|S[EÉ]RIE|EMISS|VALOR PAGO|FORMA|ITENS|LEI 12|ENDERE|TELEFONE|\bIE\b/i;
function cleanName(s){
  s=s.replace(/^\s*\d{1,3}\s+/,"").replace(/^\d{6,14}\s+/,"").replace(/\s+[A-Z]?\d{2}\s*$/,"").replace(/[|_~*"'#]+/g," ").replace(/\s+/g," ").trim();
  return s.toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/(\d)(kg|g|ml|lt|l)\b/gi,(m,a,b)=>a+({l:"L",lt:"L"}[b.toLowerCase()]||b.toLowerCase()));
}
function parseCupom(text){
  const lines=String(text).split(/\r?\n/).map(l=>l.replace(/\s+/g," ").trim()).filter(l=>l.length>1);
  const out={items:[],store:"",date:"",total:0};
  const dm=text.match(/(\d{2})[\/.-](\d{2})[\/.-](20\d{2})/);if(dm)out.date=`${dm[3]}-${dm[2]}-${dm[1]}`;
  out.store=(lines.slice(0,5).find(l=>/[A-Za-zÀ-ú]{4}/.test(l)&&!/CNPJ|DOCUMENTO|NFC|CUPOM|DANFE|AUXILIAR|CONSUMIDOR|ELETR|EXTRATO/i.test(l))||"").slice(0,40);
  const tm=text.match(/(?:VALOR\s*(?:A\s*)?PAGAR|VALOR\s*TOTAL|TOTAL)[^\d\n]{0,20}(\d{1,3}(?:\.\d{3})*,\d{2})/i);if(tm)out.total=num(tm[1]);
  const reQ=/(\d+(?:[.,]\d{1,3})?)\s*(?:UN|UND|KG|PC|PCT|CX|LT|L|G|DZ|FD|BD|SC)?\s*[xX×*]\s*(\d+[.,]\d{2,3})/i;
  const reEnd=/(\d{1,3}(?:\.\d{3})*,\d{2}|\d+\.\d{2})\s*[A-Z]?\s*$/;
  const L=s=>(String(s).match(/[A-Za-zÀ-ú]/g)||[]).length;
  let pend=null;
  for(const l of lines){
    if(SKIP.test(l)){pend=null;continue}
    const q=l.match(reQ),e=l.match(reEnd);
    if(q){
      let src=l.slice(0,q.index).trim();if(L(src)<3&&pend)src=pend;pend=null;
      const qty=num(q[1]),unit=num(q[2]);
      if(L(src)>=3&&unit>0&&unit<10000)out.items.push({name:cleanName(src),qty:qty>0&&qty<1000?qty:1,price:unit});
    }else if(e&&L(l.slice(0,e.index))>=3){
      const price=num(e[1]);pend=null;
      if(price>0&&price<10000)out.items.push({name:cleanName(l.slice(0,e.index)),qty:1,price});
    }else if(L(l)>=3)pend=l;
  }
  return out;
}
function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("script"));document.head.appendChild(s)})}
async function prepImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(2,2000/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height),p=d.data;
    for(let i=0;i<p.length;i+=4){let v=.299*p[i]+.587*p[i+1]+.114*p[i+2];v=(v-140)*1.6+140;v=v<0?0:v>255?255:v;p[i]=p[i+1]=p[i+2]=v}
    x.putImageData(d,0,0);return c;
  }finally{URL.revokeObjectURL(url)}
}
function pickCupom(){ui.cupomList=ui.screen==="list"?ui.listId:null;const f=$("#cupom-file");f.value="";f.click()}
function readCupom(file){
  sheet(`<h2>Lendo o cupom…</h2><p class="hint" id="c-msg" style="margin:0">Preparando a foto</p><div class="prog"><i id="c-bar"></i></div>
    <p style="color:var(--muted);font-size:14px">Dica: cupom esticado, foto reta, com boa luz e a lista de itens inteira no quadro.</p>`,async(el,close)=>{
    const msg=el.querySelector("#c-msg"),bar=el.querySelector("#c-bar");
    try{
      const canvas=await prepImage(file);
      msg.textContent="Carregando o leitor (demora só na primeira vez)";bar.style.width="15%";
      await loadScript(TESS);
      const worker=await Tesseract.createWorker("por",1,{logger:m=>{if(m.status==="recognizing text"){msg.textContent="Lendo os itens";bar.style.width=Math.round(20+m.progress*80)+"%"}}});
      const {data}=await worker.recognize(canvas);await worker.terminate();
      close();reviewCupom(parseCupom(data.text),data.text,false);
    }catch(e){close();reviewCupom({items:[],store:"",date:"",total:0},"",true)}
  });
}
function rowsHtml(items){return items.length?`<div class="rvh"><span></span><span>Produto</span><span>R$ unit.</span></div>`+items.map((it,i)=>`<div class="rv" data-i="${i}"><input type="checkbox" checked aria-label="Salvar este item"><input type="text" value="${esc(it.name)}" aria-label="Produto"><input type="number" inputmode="decimal" step="0.01" min="0" value="${it.price.toFixed(2)}" aria-label="Preço unitário"></div>`).join(""):""}
function reviewCupom(r,raw,failed){
  const today=todayISO(),tl=S.lists.find(x=>x.id===ui.cupomList);

  sheet(`<h2>Confira os preços</h2>${head}
    <div class="grid2"><label class="field">Mercado<input id="r-store" value="${esc(r.store)}" placeholder="ex.: Mercado do bairro"></label>
    <label class="field">Data<input id="r-date" type="date" value="${r.date||tl?.date||today}"></label></div>
    <div id="r-rows">${rowsHtml(r.items)}</div>
    <details ${r.items.length?"":"open"}><summary class="link" style="padding:8px 0;cursor:pointer">Colar texto do cupom</summary>
      <textarea id="r-raw" placeholder="Ex.: CAFE PILAO 500G 1 UN X 24,90 24,90">${esc(raw)}</textarea>
      <button class="btn" id="r-parse" style="margin-top:8px">Ler texto</button></details>
    <button class="cta alt" id="r-save">Salvar preços</button>
    <button class="btn" id="r-again" style="align-self:center">📷 Tirar outra foto</button>`,(el,close)=>{
    let items=r.items,total=r.total;
    el.querySelector("#r-parse").onclick=()=>{const p=parseCupom(el.querySelector("#r-raw").value);items=p.items;total=p.total;
      const st=el.querySelector("#r-store");if(!st.value&&p.store)st.value=p.store;if(p.date)el.querySelector("#r-date").value=p.date;
      el.querySelector("#r-rows").innerHTML=rowsHtml(items);toast(items.length?`${items.length} itens encontrados.`:"Não achei itens nesse texto.")};
    el.querySelector("#r-again").onclick=()=>{close();pickCupom()};
    el.querySelector("#r-save").onclick=()=>{
      const rows=[...el.querySelectorAll(".rv")].map(d=>{const [cb,nm,pr]=d.querySelectorAll("input");return{ok:cb.checked,name:nm.value.trim(),price:parseFloat(pr.value),qty:items[+d.dataset.i]?.qty||1}}).filter(x=>x.ok&&x.name&&x.price>0);
      if(!rows.length){toast("Nenhum item marcado com preço.");return}
      const store=el.querySelector("#r-store").value.trim(),date=el.querySelector("#r-date").value||today;
      if(S.sample){S.history=S.history.filter(h=>!h.sample);S.purchases=S.purchases.filter(p=>!p.sample);S.sample=false}
      let upd=0,mk=0;
      rows.forEach(x=>{const sz=sizeOf(x.name);S.history.push({name:x.name,price:x.price,size:sz?.size??null,sizeUnit:sz?.unit,date,store,src:"cupom"});
        S.lists.forEach(l=>l.items.forEach(it=>{if(matches(it.name,x.name)){it.price=x.price;if(sz){it.size=sz.size;it.sizeUnit=sz.unit}upd++;if(tl&&l===tl){if(x.qty)it.qty=x.qty;if(!it.done){it.done=true;mk++}}}}))});
      if(tl)tl.cupomSaved=true;
      const sum=rows.reduce((a,x)=>a+x.price*x.qty,0);
      S.purchases.push({date,total:total>0?total:Math.round(sum*100)/100,store,list:"Cupom fiscal"});
      save();close();render();toast(`${rows.length} preços salvos${mk?` · ${mk} ${mk>1?"itens marcados como comprados":"item marcado como comprado"}`:upd?` · ${upd} ${upd>1?"itens atualizados":"item atualizado"} nas listas`:""}`);
    };
  });
}

function selectMail(){const el=$("#dev-mail");if(!el)return;const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}

/* ---------- Instalar no celular (PWA) ---------- */
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isMobile=()=>isIOS()||/android/i.test(navigator.userAgent);
const showInstall=()=>!EMBED&&!isStandalone()&&(!!deferredPrompt||isMobile());
const installSnoozed=()=>S.installSnooze&&Date.now()-S.installSnooze<7*864e5;
function installCard(){return `<div class="promo c-sky"><span class="em">📲</span><span class="t"><b>Instale no celular</b>Abre direto da tela inicial, como app, e funciona sem internet.</span>
  <span class="side"><button class="btn dark" data-act="install">Instalar</button><button class="link" data-act="install-later">Agora não</button></span></div>`}
async function doInstall(){
  if(deferredPrompt){const p=deferredPrompt;deferredPrompt=null;p.prompt();const r=await p.userChoice.catch(()=>null);if(r&&r.outcome==="accepted")toast("Instalando…");render();return}
  const ios=isIOS(),inApp=/Instagram|FBAN|FBAV|WhatsApp|Line\/|TikTok/i.test(navigator.userAgent);
  sheet(`<h2>Instalar no ${ios?"iPhone":"Android"}</h2>
    ${inApp?`<div class="alert"><b>Abra no ${ios?"Safari":"Chrome"} primeiro.</b> Você está no navegador de outro app. Toque em ··· ou ⋮ e escolha "Abrir no ${ios?"Safari":"navegador"}".</div>`:""}
    <ol class="steps">${ios
      ?`<li>Toque em <b>Compartilhar</b>, o quadrado com a seta ↑ na barra do Safari.</li><li>Role a lista e toque em <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>. O ícone aparece junto dos seus apps.</li>`
      :`<li>Toque no menu <b>⋮</b> do Chrome, no canto de cima.</li><li>Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li><li>Confirme em <b>Instalar</b>. O ícone aparece junto dos seus apps.</li>`}</ol>
    <button class="cta" id="i-ok">Entendi</button>`,(el,close)=>{el.querySelector("#i-ok").onclick=close});
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;render()});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;toast("App instalado na tela inicial.");render()});
if("serviceWorker" in navigator&&!EMBED&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
$("#cupom-file").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)readCupom(f)});

render();
</script>
